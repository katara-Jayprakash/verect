apiVersion: apps/v1
kind: Deployment
metadata:
  name: verect-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: proxy
  template:
    metadata:
      labels:
        app: proxy
    spec:
      containers:
      - name: proxy-container
        image: builderServer12.azurecr.io/reverse-go-proxy:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        envFrom:
        - secretRef:
            name: proxy-secrets

---
apiVersion: v1
kind: Service
metadata:
  name: proxy-service
spec:
  type: LoadBalancer
  selector:
    app: proxy
  ports:
  - port: 80
    targetPort: 80
